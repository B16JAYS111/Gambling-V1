<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Casino Project</title>
    <style>
        /* Modern, clean casino styling */
        body {
            background-color: #1a3c1e; /* Classic casino green background */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            margin-top: 10px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .balance-display {
            font-size: 26px;
            font-weight: bold;
            color: #2ecc71;
            margin-bottom: 20px;
            background-color: #112213;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 30px;
            border: 2px solid #2ecc71;
        }

        /* Top navigation menu bar */
        .menu-bar {
            background-color: #112213;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .menu-bar button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        
        .menu-bar button:hover {
            background-color: #d35400;
            transform: translateY(-2px);
        }

        /* Game table container boxes */
        .game-container {
            background-color: #2c3e50;
            border: 4px solid #f1c40f;
            border-radius: 15px;
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 25px;
            min-height: 420px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Utility class to hide/show active game windows */
        .hidden {
            display: none !important;
        }

        canvas {
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.3);
            max-width: 100%;
        }

        .control-panel button {
            background-color: #34495e;
            color: white;
            border: 2px solid #bdc3c7;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .control-panel button:hover {
            background-color: #f1c40f;
            color: #2c3e50;
            border-color: #f1c40f;
        }
    </style>
</head>
<body>

    <h1>🎰 Welcome to the Casino 🃏</h1>
    
    <div class="balance-display">
        Wallet: $<span id="player-balance">1000</span>
    </div>

    <div class="menu-bar">
        <button onclick="showGame('video-poker')">Play Video Poker</button>
        <button onclick="showGame('texas-holdem')">Play Texas Hold 'em</button>
    </div>

    <div id="video-poker-game" class="game-container">
        <h2>Video Poker</h2>
        <p>Fix Status: Click anywhere inside the card frame boundaries to toggle a hold!</p>
        
        <canvas id="pokerCanvas" width="600" height="300" style="background: #0e6251;"></canvas>
        <br><br>
        
        <div class="control-panel">
            <button id="deal-poker-btn">Deal / Draw</button>
        </div>
    </div>

    <div id="texas-holdem-game" class="game-container hidden">
        <h2>Texas Hold 'em</h2>
        <p>Face off against the house. Manage your streets sequentially below.</p>
        
        <canvas id="holdemCanvas" width="700" height="350" style="background: #116743;"></canvas>
        <br><br>
        
        <div id="holdem-controls" class="control-panel">
            <button>Check</button>
            <button style="border-color: #2ecc71;">Bet / Raise</button>
            <button style="border-color: #e74c3c;">Fold</button>
        </div>
    </div>

    <script>
        /**
         * Hides inactive game layouts and exposes the chosen visual loop 
         */
        function showGame(gameId) {
            // Hide all layouts dynamically
            document.getElementById('video-poker-game').classList.add('hidden');
            document.getElementById('texas-holdem-game').classList.add('hidden');
            
            // Remove the hidden attribute on selection choice
            if (gameId === 'video-poker') {
                document.getElementById('video-poker-game').classList.remove('hidden');
            } else if (gameId === 'texas-holdem') {
                document.getElementById('texas-holdem-game').classList.remove('hidden');
            }
        }
    </script>

    <script src="video-poker.js"></script>
    
    <script src="texas-holdem.js"></script>

</body>
</html>
